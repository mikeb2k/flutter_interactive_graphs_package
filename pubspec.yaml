name: interactive_graphs
description: "Interactive directed graph viewer for Flutter: hierarchical and force-directed layouts, pan and zoom, styled and labelled edges, anchors, selection, hover and node drag."
version: 0.2.1
repository: https://github.com/mikeb2k/flutter_interactive_graphs_package
issue_tracker: https://github.com/mikeb2k/flutter_interactive_graphs_package/issues
topics:
  - graph
  - diagram
  - visualization
  - layout
  - widget
screenshots:
  - description: "The example app: the graph grows node by node, an order runs through it and the camera follows."
    path: doc/images/demo-interaction.gif
  - description: An order on its way through the graph, on a phone.
    path: doc/images/demo-phone.png
  - description: A step expanded to show its details, on a phone.
    path: doc/images/demo-phone-details.png
  - description: The same graph laid out left to right in a desktop window.
    path: doc/images/demo-desktop.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  meta: ^1.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

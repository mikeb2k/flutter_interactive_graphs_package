name: Deploy demo

# Builds the example app for the web and publishes it to GitHub Pages:
# https://mikeb2k.github.io/flutter_interactive_graphs_package/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true
      # --wasm also emits the JavaScript build, which browsers without WasmGC load instead
      - name: Build the example for the web
        working-directory: example
        run: |
          flutter pub get
          flutter build web --wasm --release --base-href /flutter_interactive_graphs_package/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
